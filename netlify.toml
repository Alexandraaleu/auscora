# Netlify build settings (picked up automatically when the repo is connected)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for every route so /contact, /team etc.
# work when opened directly or refreshed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
